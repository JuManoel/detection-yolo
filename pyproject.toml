[project]
name = "avesia-detector"
version = "0.1.0"
description = "Bird detection pipelines with YOLO26 fine-tuning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.3.0",
    "kaggle>=1.6.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "Pillow>=10.0.0",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
]

[project.scripts]
download = "pipelines.download.cli:main"
train = "pipelines.train.cli:main"
metrics = "pipelines.metrics.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipelines"]
